<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agent Data Plane</title><style>
body{margin:0;background:#10151d;color:#e8eef6;font:15px system-ui,sans-serif}.wrap{max-width:1060px;margin:auto;padding:38px 22px}h1{font-size:28px;margin:0}p{color:#a8b6c7}.bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:24px 0}.badge{padding:5px 10px;border-radius:20px;background:#233247;color:#8ed0ff}.card{background:#18212d;border:1px solid #2b3a4e;border-radius:12px;padding:18px;margin:14px 0}button{background:#4da3ff;border:0;border-radius:8px;padding:10px 14px;font-weight:650;cursor:pointer}button.warn{background:#dc9c46}button:disabled{opacity:.5}pre{white-space:pre-wrap;word-break:break-word;color:#c9d7e8}table{width:100%;border-collapse:collapse}td,th{padding:9px;border-bottom:1px solid #2b3a4e;text-align:left}.ok{color:#70e0a2}.bad{color:#ff8f96}</style></head><body><main class="wrap"><h1>Agent Improvement Data Plane</h1><p>本机控制台 · 仅白名单操作 · 建议通过 SSH 隧道访问</p><div class="bar"><button onclick="action('/api/smoke/run')">运行真实 Smoke</button><button class="warn" onclick="action('/api/model/restart')">重启 14B 服务</button><button onclick="refresh()">刷新</button><span id="state" class="badge">加载中</span></div><section class="card"><h2>运行状态</h2><pre id="status"></pre></section><section class="card"><h2>最近 Runs</h2><table><thead><tr><th>目录</th><th>完整性</th><th>Verifier</th><th>任务</th></tr></thead><tbody id="runs"></tbody></table></section><section class="card"><h2>最近操作</h2><pre id="job">尚无操作</pre></section></main><script>
async function refresh(){const r=await fetch('/api/status');const x=await r.json();document.querySelector('#status').textContent=JSON.stringify({model:x.model,gpu:x.gpu.stdout,docker_image:x.docker_image.stdout},null,2);document.querySelector('#state').textContent=x.model.ok?'模型在线':'模型离线';document.querySelector('#state').className='badge '+(x.model.ok?'ok':'bad');document.querySelector('#runs').innerHTML=x.recent_runs.map(v=>`<tr><td>${v.run_directory}</td><td>${v.integrity}</td><td>${v.verifier_status||''}</td><td>${v.task_status||''}</td></tr>`).join('')}
async function action(url){const r=await fetch(url,{method:'POST'});const x=await r.json();document.querySelector('#job').textContent=JSON.stringify(x,null,2);if(x.job_id){setTimeout(()=>job(x.job_id),1200)}refresh()}
async function job(id){const r=await fetch('/api/jobs/'+id);const x=await r.json();document.querySelector('#job').textContent=JSON.stringify(x,null,2);if(x.status==='RUNNING')setTimeout(()=>job(id),1200);else refresh()}refresh();setInterval(refresh,8000);
</script></body></html>
