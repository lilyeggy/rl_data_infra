[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-improvement-data-plane"
version = "0.1.0"
description = "Trusted execution evidence for harness and model improvement"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
agent-data-plane = "src.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
exclude = ["archive*", "experiments*", "tests*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
