schema_version: agent-improvement-project/v1

project:
  name: agent-improvement-data-plane
  objective: trusted_evidence_for_harness_and_model_improvement

boundaries:
  owns_local_launch_lifecycle: true
  owns_distributed_rollout_orchestration: false
  owns_training_algorithm: false
  owns_identity_evidence_certification_and_datasets: true
  primary_execution_provider: local_docker
  optional_rollout_producers:
    - polar
    - pi_direct
  optional_trainers:
    - slime

hardware:
  sandbox_host: mac_docker_desktop
  model_host: user_rented_single_gpu
  gpu_model: nvidia_rtx_a6000_48gb
  execution_mode: local_sandbox_remote_model_time_sliced_training

workflow:
  phases:
    - rollout_only
    - certify_and_compile
    - train_only
    - fixed_holdout_evaluation
  simultaneous_training_and_rollout: false
  require_policy_fingerprint_handoff: true

data:
  immutable_raw_evidence: true
  fail_closed_certification: true
  prevent_task_split_leakage: true
  infrastructure_failure_is_reward_zero: false
  allow_retokenized_on_policy_data: false

status:
  local_docker_launcher: real_docker_no_gpu_full_chain_validated
  model_proxy_evidence: controlled_14b_native_token_logprob_revision_live_validated
  harness_event_ingress: authenticated_execution_bound_ingress_validated
  local_execution_orchestrator: prepare_proxy_harness_verifier_finalize_cleanup_validated
  local_run_finalizer: real_docker_no_gpu_full_chain_validated
  artifact_capture: stdout_stderr_workspace_diff_patch_verifier_report_validated
  target_harness_remote_14b: live_validated_with_pi_proxy_verifier_bundle
  polar_http_and_result_adapter: implemented_not_live_validated
  slime_bridge: upstream_owned_not_live_validated
  single_gpu_end_to_end: sft_and_fixed_holdout_validated_candidate_rejected
